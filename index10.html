<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

   <style>
    #page{
        height:100vh;
        width: 100%;
        background-color:#433E5A;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    #page #container {
        height: 80%;
        width: 90%;
        background:linear-gradient( #4a3552 10%, #0E0E11 100%);
        /* background-image: url('https://images.unsplash.com/photo-1483982258113-b72862e6cff6?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D'); */
        background-size:auto;
        border-radius: 30px;
    }
    #container #nav{
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: space-around ;
        color: white;
        font-size: 10px;
        font-family: sans-serif;
    }
    #nav #navcenter{
        display: flex;
        gap: 20px;
        align-items: center;
    }
    #nav #navright{
        display: flex;
        gap: 20px;
    }
    #nav #navright #loginbtn{
        padding: 10px 20px;
        border-radius: 50px;
        border: 1px solid #c0bebe;
        background-color: transparent;
        color:white;
        font-size: 15px;
    }

    #nav #navright #signUpbtn{
        border-radius: 50px;
        border: none;
        padding: 10px 20px;
        font-size: 15px;
    }


    #page #section{
        height: 100%;
        width: 100%;
        /* background-color: white; */
        overflow: hidden;
        text-align: center;
        margin-top: 5%;

    }


    #section h1{
        color: white;
        font-family: sans-serif;
        font-size: 55px;
    }
    #section p{
        font-size: 20px;
        color: rgb(150, 148, 148);
        font-family: sans-serif;
    }
    #section button {
        padding: 20px 30px;
        border-radius: 50px;
        border: none;
        font-size:15px;
        background-color: #fff;
    }
    #section #box{
        height: 100px;
    width: 200px;
    background-color: #f5f1f13c;
    backdrop-filter: blur(10%);
    /* margin-top: -10%; */
    /* margin-left: 20% */
    }
   </style>
</head>
<body>
    

    <div id="page">
        <div id="container">
            <div id="nav">
                <div id="navleft">
                    <h1>Liquid Brokers</h1>
                </div>
                <div id="navcenter">
                    <h1>About</h1>
                    <h1>Trading</h1>
                    <h1>Contact</h1>
                    <h1>FAQ</h1>
                </div>
                <div id="navright">
                    <button id="loginbtn">
                        Login

                    </button>
                    <button id="signUpbtn">
                        SignUp
                    </button>
                </div>
            </div>


            <div id="section">
               
                <div id="sectionTop">
                    <h1>Elevate your <br> Trading Experience </h1>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. <br> Nemo eos ratione, aspernatur quis magni corporis quasi aliquid nam labore ut</p>
    
                    <button>Sign Up & Trade</button>
                </div>
                <div id="box">

                </div>
            </div>
            <!-- <video  autoplay muted  loop src="https://cdn.dribbble.com/userupload/18532089/file/large-1da598d657209664723b0817724ae8a0.mp4"></video> -->

        </div>
    </div>
</body>
</html>
